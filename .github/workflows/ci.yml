name: ATLAS CI
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/validar_release.py
      - run: python scripts/validar_higiene.py
      - run: python -m compileall -q atlas tests *.py tools
      - run: pytest -q
